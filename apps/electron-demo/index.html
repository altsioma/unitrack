<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>unitrack demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 12px; font-size: 14px; }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .row label { min-width: 56px; }
    #seek, #volume { flex: 1; }
    #queue-list { list-style: none; padding: 0; margin: 8px 0; max-height: 320px; overflow-y: auto; border: 1px solid #ccc; }
    #queue-list li { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-bottom: 1px solid #eee; }
    #queue-list li.current { background: #eef; font-weight: bold; }
    #queue-list li .title { flex: 1; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #queue-list button { flex-shrink: 0; }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="row">
    <button id="open-file">Open File</button>
    <button id="open-folder">Open Folder</button>
  </div>
  <div class="row">
    <button id="prev">⏮ Prev</button>
    <button id="play">▶ Play</button>
    <button id="pause">⏸ Pause</button>
    <button id="stop">⏹ Stop</button>
    <button id="next">⏭ Next</button>
  </div>
  <div class="row">
    <button id="shuffle">Shuffle: off</button>
    <button id="repeat">Repeat: off</button>
  </div>
  <div class="row">
    <label for="seek">Seek</label>
    <input type="range" id="seek" min="0" max="0" step="1" value="0">
    <span id="time">0:00 / 0:00</span>
  </div>
  <div class="row">
    <label for="volume">Volume</label>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
  </div>
  <p id="status">idle</p>
  <ul id="queue-list"></ul>
</body>
</html>
